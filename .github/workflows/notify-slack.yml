name: Slack 문서 알림

on:
  push:
    branches: [main]
    paths:
      - '**.md'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Slack으로 변경 알림
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 시크릿 미설정 — 알림 건너뜀"
            exit 0
          fi
          CHANGED=$(jq -r '[.commits[].modified[]?, .commits[].added[]?] | unique | map(select(endswith(".md"))) | join(", ")' "$GITHUB_EVENT_PATH")
          TEXT="📝 *던전 정육점 문서 업데이트* — ${AUTHOR}
          > ${COMMIT_MSG}
          변경: ${CHANGED}
          <${COMMIT_URL}|커밋 보기>"
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -s -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL"
